<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Credenciales</title>
    <!-- Tailwind CSS para estilos modernos y responsivos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons para iconos limpios y vectoriales -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        crimson: {
                            500: '#ef4444',
                            600: '#dc2626',
                            700: '#b91c1c',
                            800: '#991b1b',
                            900: '#7f1d1d',
                            950: '#450a0a',
                        },
                        obsidian: {
                            800: '#171717',
                            900: '#0f0f0f',
                            950: '#070707',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans antialiased min-h-screen bg-obsidian-950 text-gray-100 flex items-center justify-center p-4 relative overflow-hidden selection:bg-crimson-600 selection:text-white">

    <!-- Elementos decorativos de fondo (Degradados rojo y negro) -->
    <div class="fixed inset-0 z-0 pointer-events-none">
        <!-- Gradiente radial principal -->
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-crimson-950/60 via-obsidian-950 to-black"></div>
        <!-- Resplandor rojo sutil superior izquierdo -->
        <div class="absolute -top-24 -left-24 w-96 h-96 bg-crimson-800/20 rounded-full blur-3xl"></div>
        <!-- Resplandor rojo sutil inferior derecho -->
        <div class="absolute -bottom-32 -right-20 w-[30rem] h-[30rem] bg-crimson-900/25 rounded-full blur-3xl"></div>
        <!-- Patrón de cuadrícula sutil -->
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#ffffff05_1px,transparent_1px),linear-gradient(to_bottom,#ffffff05_1px,transparent_1px)] bg-[size:32px_32px]"></div>
    </div>

    <!-- Contenedor Principal (Tarjeta de Inicio de Sesión) -->
    <main class="relative z-10 w-full max-w-md">
        <!-- Borde brillante sutil alrededor de la tarjeta -->
        <div class="bg-gradient-to-b from-crimson-600/30 via-neutral-800/40 to-neutral-900/40 p-[1px] rounded-2xl shadow-2xl shadow-black/80">
            <div class="bg-obsidian-900/90 backdrop-blur-xl rounded-2xl p-6 sm:p-8 border border-white/5">
                
                <!-- Encabezado de la tarjeta -->
                <div class="text-center mb-8">
                    <!-- Icono de escudo/seguridad -->
                    <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-gradient-to-br from-crimson-600 to-crimson-900 text-white shadow-lg shadow-crimson-900/50 mb-4 border border-crimson-500/30">
                        <i data-lucide="shield-check" class="w-7 h-7"></i>
                    </div>
                    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">
                        Credenciales
                    </h1>
                    <p class="text-sm text-neutral-400 mt-2">
                        Ingresa tus datos de acceso para continuar al sistema
                    </p>
                </div>

                <!-- Contenedor de Notificación / Alerta Elegante (Oculto por defecto) -->
                <div id="alertBox" class="hidden mb-6 rounded-xl p-4 text-sm flex items-start gap-3 transition-all duration-300 border" role="alert">
                    <i id="alertIcon" data-lucide="alert-circle" class="w-5 h-5 shrink-0 mt-0.5"></i>
                    <div class="flex-1">
                        <h3 id="alertTitle" class="font-semibold"></h3>
                        <p id="alertMessage" class="text-xs mt-0.5 opacity-90"></p>
                    </div>
                    <button type="button" onclick="hideAlert()" class="opacity-70 hover:opacity-100 transition-opacity p-1" aria-label="Cerrar notificación">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>

                <!-- Formulario de Inicio de Sesión -->
                <form id="loginForm" class="space-y-5" novalidate>
                    
                    <!-- Campo: Usuario -->
                    <div>
                        <label for="username" class="block text-sm font-medium text-neutral-300 mb-1.5">
                            Usuario
                        </label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-neutral-500 group-focus-within:text-crimson-500 transition-colors">
                                <i data-lucide="user" class="w-5 h-5"></i>
                            </div>
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                autocomplete="username"
                                placeholder="Ingresa tu usuario o correo"
                                class="block w-full pl-11 pr-4 py-3 bg-obsidian-950/80 border border-neutral-800 rounded-xl text-white placeholder-neutral-500 text-sm focus:outline-none focus:border-crimson-600 focus:ring-2 focus:ring-crimson-600/20 transition-all"
                                required
                            >
                        </div>
                    </div>

                    <!-- Campo: Contraseña -->
                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <label for="password" class="block text-sm font-medium text-neutral-300">
                                Contraseña
                            </label>
                            <a href="#recuperar" id="forgotPasswordLink" class="text-xs font-medium text-crimson-500 hover:text-crimson-400 transition-colors">
                                ¿Olvidaste tu contraseña?
                            </a>
                        </div>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-neutral-500 group-focus-within:text-crimson-500 transition-colors">
                                <i data-lucide="lock" class="w-5 h-5"></i>
                            </div>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                autocomplete="current-password"
                                placeholder="••••••••••••"
                                class="block w-full pl-11 pr-12 py-3 bg-obsidian-950/80 border border-neutral-800 rounded-xl text-white placeholder-neutral-500 text-sm focus:outline-none focus:border-crimson-600 focus:ring-2 focus:ring-crimson-600/20 transition-all"
                                required
                            >
                            <!-- Botón para mostrar/ocultar contraseña -->
                            <button 
                                type="button" 
                                id="togglePassword"
                                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-neutral-500 hover:text-neutral-300 focus:outline-none transition-colors"
                                aria-label="Mostrar u ocultar contraseña"
                            >
                                <i id="eyeIcon" data-lucide="eye" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Opción: Recordar sesión -->
                    <div class="flex items-center">
                        <input 
                            id="remember-me" 
                            name="remember-me" 
                            type="checkbox" 
                            class="h-4 w-4 rounded border-neutral-700 bg-obsidian-950 text-crimson-600 focus:ring-crimson-600/30 focus:ring-offset-0 accent-crimson-600 cursor-pointer"
                        >
                        <label for="remember-me" class="ml-2 block text-xs sm:text-sm text-neutral-400 cursor-pointer select-none">
                            Mantener sesión iniciada en este dispositivo
                        </label>
                    </div>

                    <!-- Botón de Envío -->
                    <div class="pt-2">
                        <button 
                            type="submit" 
                            id="submitBtn"
                            class="w-full flex items-center justify-center gap-2 py-3.5 px-4 rounded-xl text-sm font-semibold text-white bg-gradient-to-r from-crimson-700 via-crimson-600 to-crimson-700 hover:from-crimson-600 hover:via-crimson-500 hover:to-crimson-600 focus:outline-none focus:ring-2 focus:ring-crimson-500 focus:ring-offset-2 focus:ring-offset-obsidian-900 shadow-lg shadow-crimson-900/40 active:scale-[0.99] transition-all duration-200 cursor-pointer"
                        >
                            <span>Iniciar sesión</span>
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </button>
                    </div>

                </form>

                <!-- Pie de tarjeta -->
                <div class="mt-8 pt-5 border-t border-neutral-800/80 text-center">
                    <p class="text-xs text-neutral-500 flex items-center justify-center gap-1.5">
                        <i data-lucide="shield" class="w-3.5 h-3.5 text-crimson-600"></i>
                        Conexión cifrada de extremo a extremo
                    </p>
                </div>

            </div>
        </div>
    </main>

    <!-- Lógica de Interacción y Validación -->
    <script>
        // Inicializar iconos de Lucide
        lucide.createIcons();

        // Referencias a elementos del DOM
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');
        const forgotPasswordLink = document.getElementById('forgotPasswordLink');
        const submitBtn = document.getElementById('submitBtn');

        // Referencias al sistema de alertas personalizadas
        const alertBox = document.getElementById('alertBox');
        const alertTitle = document.getElementById('alertTitle');
        const alertMessage = document.getElementById('alertMessage');
        const alertIcon = document.getElementById('alertIcon');

        /**
         * Muestra una notificación estilizada dentro de la tarjeta
         * @param {string} type - 'error' | 'success' | 'info'
         * @param {string} title - Título corto de la alerta
         * @param {string} message - Descripción detallada
         */
        function showAlert(type, title, message) {
            // Limpiar clases previas de color
            alertBox.classList.remove(
                'hidden',
                'bg-crimson-950/80', 'border-crimson-700/60', 'text-crimson-200',
                'bg-emerald-950/80', 'border-emerald-700/60', 'text-emerald-200',
                'bg-neutral-800/90', 'border-neutral-600/60', 'text-neutral-200'
            );

            let iconName = 'alert-circle';

            if (type === 'error') {
                alertBox.classList.add('bg-crimson-950/80', 'border-crimson-700/60', 'text-crimson-200');
                iconName = 'alert-triangle';
            } else if (type === 'success') {
                alertBox.classList.add('bg-emerald-950/80', 'border-emerald-700/60', 'text-emerald-200');
                iconName = 'check-circle-2';
            } else {
                alertBox.classList.add('bg-neutral-800/90', 'border-neutral-600/60', 'text-neutral-200');
                iconName = 'info';
            }

            alertTitle.textContent = title;
            alertMessage.textContent = message;

            // Actualizar el icono dinámicamente
            alertIcon.setAttribute('data-lucide', iconName);
            lucide.createIcons();
        }

        /**
         * Oculta la notificación actual
         */
        function hideAlert() {
            alertBox.classList.add('hidden');
        }

        // Alternar visibilidad de la contraseña
        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            
            // Cambiar icono entre ojo abierto y ojo tachado
            eyeIcon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
            lucide.createIcons();
        });

        // Manejar clic en "¿Olvidaste tu contraseña?"
        forgotPasswordLink.addEventListener('click', (e) => {
            e.preventDefault();
            const userVal = usernameInput.value.trim();
            if (userVal) {
                showAlert(
                    'info',
                    'Recuperación solicitada',
                    Se han enviado instrucciones de restablecimiento asociadas al usuario "${userVal}".
                );
            } else {
                showAlert(
                    'info',
                    'Recuperar contraseña',
                    'Por favor, escribe primero tu nombre de usuario en el campo superior para ayudarte a recuperar tu acceso.'
                );
                usernameInput.focus();
            }
        });

        // Validación y envío del formulario
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            hideAlert();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            // 1. Validar campos vacíos
            if (!username && !password) {
                showAlert('error', 'Campos requeridos', 'Por favor, ingresa tu usuario y contraseña para continuar.');
                usernameInput.focus();
                return;
            }

            if (!username) {
                showAlert('error', 'Usuario faltante', 'El campo de usuario no puede estar vacío.');
                usernameInput.focus();
                return;
            }

            if (!password) {
                showAlert('error', 'Contraseña faltante', 'Por favor, introduce tu contraseña.');
                passwordInput.focus();
                return;
            }

            // 2. Validar longitud mínima de contraseña
            if (password.length < 4) {
                showAlert('error', 'Contraseña demasiado corta', 'La contraseña debe contener al menos 4 caracteres.');
                passwordInput.focus();
                return;
            }

            // 3. Simulación de proceso de autenticación
            const originalBtnContent = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
            submitBtn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Verificando...</span>
            `;

            // Simular latencia de red (800ms)
            setTimeout(() => {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                submitBtn.innerHTML = originalBtnContent;
                lucide.createIcons();

                showAlert(
                    'success',
                    '¡Acceso concedido!',
                    Bienvenido de nuevo, ${username}. Redirigiendo al panel principal...
                );
            }, 800);
        });
    </script>
</body>
</html>
